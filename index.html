<script>
        let toastTimeout;

        // 頁面載入時自動計算已解鎖關卡數量並更新 HUD
        window.addEventListener('DOMContentLoaded', () => {
            const totalStages = document.querySelectorAll('.stage-card').length;
            const unlockedCount = document.querySelectorAll('.stage-card.unlocked').length;
            const paddedCount = String(unlockedCount).padStart(2, '0');
            const paddedTotal = String(totalStages).padStart(2, '0');

            // 更新 COINS、PROGRESS 與 SCORE
            const hudValues = document.querySelectorAll('.hud-value');
            if (hudValues.length >= 4) {
                hudValues[0].innerText = String(unlockedCount * 1000).padStart(6, '0'); // 分數
                hudValues[1].innerHTML = `<span class="coin-icon"></span> x${paddedCount}`; // 金幣數
                hudValues[3].innerText = `${paddedCount}/${paddedTotal}`; // 進度
            }
        });

        // Function to trigger locked toast notification
        function showLockedMessage(weekNum) {
            const toast = document.getElementById('toast');
            toast.innerText = `🔒 STAGE ${weekNum} 尚未解鎖！繼續努力學習吧！`;
            toast.classList.add('show');

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        // CRT Filter Toggle Logic
        function toggleCRT() {
            const overlay = document.getElementById('crtOverlay');
            const btn = document.getElementById('crtToggle');

            if (overlay.style.display === 'none') {
                overlay.style.display = 'block';
                btn.innerText = 'CRT: ON';
            } else {
                overlay.style.display = 'none';
                btn.innerText = 'CRT: OFF';
            }
        }
    </script>
